<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MENZ 快餐 · 全天运营模拟</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      background: #0a0a14;
      color: #e0e0e0;
      min-height: 100vh;
    }

    /* 顶部时间轴 */
    .top-bar {
      background: #12121e;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 2px solid #1e1e3a;
      overflow-x: auto;
      flex-wrap: nowrap;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .hour-btn {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      color: #444;
      cursor: pointer;
      border: 1px solid transparent;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .hour-btn:hover { color: #e0e0e0; border-color: #333; }
    .hour-btn.active { background: #e94560; color: #fff; font-weight: bold; border-color: #e94560; }
    .hour-btn.phase-procure { background: #1d4ed8; color: #fff; }
    .hour-btn.phase-prep { background: #15803d; color: #fff; }
    .hour-btn.phase-cook { background: #b45309; color: #fff; }
    .hour-btn.phase-open { background: #e94560; color: #fff; }
    .hour-btn.phase-close { background: #374151; color: #888; }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
      flex-shrink: 0;
    }
    .clock {
      font-size: 26px;
      font-weight: bold;
      color: #e94560;
      font-variant-numeric: tabular-nums;
    }
    .speed-btns { display: flex; gap: 4px; }
    .speed-btns button {
      background: #1e1e3a;
      border: 1px solid #333;
      color: #888;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }
    .speed-btns button.active { background: #e94560; color: #fff; border-color: #e94560; }
    .play-btn {
      background: #e94560;
      border: none;
      color: #fff;
      padding: 5px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }

    /* 主布局 */
    .main {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 2px;
      padding: 2px;
    }
    .panel {
      background: #12121e;
      padding: 12px;
    }
    .panel-title {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #1e1e3a;
    }

    /* 采购面板 */
    .budget-bar {
      background: #1a1a2e;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .budget-label { font-size: 12px; color: #888; }
    .budget-val { font-size: 20px; font-weight: bold; color: #f39c12; }

    .procure-list {
      background: #0f0f1a;
      border-radius: 8px;
      padding: 10px;
      max-height: 400px;
      overflow-y: auto;
    }
    .procure-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #1a1a2e;
      font-size: 12px;
    }
    .procure-item:last-child { border-bottom: none; }
    .procure-item .name { color: #aaa; }
    .procure-item .price { color: #888; }
    .procure-item .qty { color: #f39c12; font-weight: bold; }
    .procure-item.selected { background: #1a1a2e; border-radius: 4px; padding: 4px 6px; }

    .ai-decision-box {
      background: #0f0f1a;
      border: 1px solid #1d4ed8;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
    }
    .ai-decision-title { font-size: 11px; color: #1d4ed8; font-weight: bold; margin-bottom: 6px; }
    .ai-decision-text { font-size: 12px; color: #aaa; line-height: 1.6; }
    .ai-tag { color: #e94560; font-weight: bold; }

    /* 配菜进度 */
    .prep-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 10px;
      max-height: 320px;
      overflow-y: auto;
    }
    .basket-card {
      background: #1a1a2e;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
    }
    .basket-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .basket-id { color: #555; font-size: 10px; min-width: 24px; }
    .basket-dish { color: #e0e0e0; font-weight: bold; flex: 1; }
    .basket-tier { font-size: 10px; font-weight: bold; }
    .basket-ings { color: #888; font-size: 10px; margin-bottom: 5px; line-height: 1.4; }
    .basket-progress-wrap { background: #222; border-radius: 3px; height: 4px; margin-bottom: 4px; overflow: hidden; }
    .basket-progress-bar { height: 100%; border-radius: 3px; transition: width 0.5s; }
    .basket-status { color: #555; font-size: 10px; }
    .basket-summary {
      grid-column: 1/-1;
      background: #0f1a0f;
      border: 1px solid #1a3a1a;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 11px;
      color: #4ade80;
      text-align: center;
      margin-top: 4px;
    }

    /* 厨房备菜指令 */
    .kitchen-prep-panel {
      background: #0f1a2e;
      border: 1px solid #1d4ed8;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .kp-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; font-weight: bold; color: #fff; }
    .kp-dot { width: 10px; height: 10px; border-radius: 50%; background: #1d4ed8; flex-shrink: 0; }
    .kp-dot.active { background: #22c55e; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .kp-instructions {
      background: #12122a;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12px;
      color: #c4d4f0;
      line-height: 1.8;
      margin-bottom: 10px;
      border-left: 3px solid #1d4ed8;
    }
    .kp-instructions .kp-step { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .kp-instructions .kp-step-num { color: #1d4ed8; font-weight: bold; min-width: 20px; }
    .kp-instructions .kp-step-text { flex: 1; }
    .kp-instructions .kp-step-done { color: #4ade80; text-decoration: line-through; }
    .kp-instructions .kp-step-active { color: #fbbf24; font-weight: bold; }
    .kp-progress-area { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .kp-dish-card { background: #1a1a2e; border-radius: 6px; padding: 8px; border-left: 3px solid #1d4ed8; }
    .kp-dish-card.tier-A { border-left-color: #e94560; }
    .kp-dish-card.tier-B { border-left-color: #f39c12; }
    .kp-dish-card.tier-C { border-left-color: #27ae60; }
    .kp-dish-name { font-size: 11px; color: #e0e0e0; font-weight: bold; margin-bottom: 3px; }
    .kp-dish-baskets { font-size: 10px; color: #888; }
    .kp-dish-bar { background: #222; border-radius: 3px; height: 4px; margin-top: 4px; overflow: hidden; }
    .kp-dish-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
    .kp-done-banner {
      background: #0f2a1a;
      border: 1px solid #22c55e;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      color: #4ade80;
      font-size: 14px;
      font-weight: bold;
      margin-top: 8px;
    }
    .prep-dish {
      background: #1a1a2e;
      border-radius: 8px;
      padding: 8px;
      border: 1px solid #222;
    }
    .prep-dish.name { font-size: 12px; color: #fff; font-weight: bold; margin-bottom: 4px; }
    .prep-dish.status { font-size: 10px; color: #888; }
    .prep-dish.status.done { color: #27ae60; }
    .prep-dish.status.cooking { color: #f39c12; }
    .prep-progress {
      height: 4px;
      background: #222;
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }
    .prep-progress-fill {
      height: 100%;
      background: #27ae60;
      border-radius: 2px;
      transition: width 0.5s;
    }

    /* 收银面板 */
    .pos-display {
      background: #1a1a2e;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      margin-bottom: 10px;
    }
    .pos-period { font-size: 12px; color: #888; margin-bottom: 4px; }
    .pos-price { font-size: 40px; font-weight: bold; color: #e94560; }
    .pos-tier { font-size: 12px; color: #666; margin-top: 4px; }
    .pos-status-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 11px;
      margin-top: 8px;
    }
    .pill-normal { background: #e94560; color: #fff; }
    .pill-discount { background: #b45309; color: #fff; }
    .pill-free { background: #27ae60; color: #fff; }
    .pill-closed { background: #333; color: #888; }
    .pill-procure { background: #1d4ed8; color: #fff; }
    .pill-prep { background: #15803d; color: #fff; }
    .pill-cook { background: #b45309; color: #fff; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }
    .stat-card {
      background: #1a1a2e;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-num { font-size: 22px; font-weight: bold; color: #fff; }
    .stat-num.green { color: #27ae60; }
    .stat-num.yellow { color: #f39c12; }
    .stat-label { font-size: 10px; color: #666; margin-top: 2px; }

    /* 后厨电视 */
    .kitchen-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .f3-card {
      background: #1a1a2e;
      border-radius: 8px;
      padding: 10px;
      border: 2px solid #222;
      transition: all 0.3s;
    }
    .f3-card.active { border-color: #27ae60; }
    .f3-card.cooking { border-color: #f39c12; }
    .f3-card.idle { opacity: 0.5; }
    .f3-num { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .f3-dish { font-size: 13px; font-weight: bold; color: #fff; min-height: 18px; }
    .f3-next { font-size: 10px; color: #666; min-height: 14px; margin-bottom: 6px; }
    .f3-status-pill {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 8px;
      display: inline-block;
    }
    .st-idle { background: #333; color: #888; }
    .st-ready { background: #15803d; color: #fff; }
    .st-cooking { background: #b45309; color: #fff; }

    /* A档控制 */
    .a-control {
      background: #1a1a2e;
      border: 2px solid #6b21a8;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .a-header { font-size: 11px; color: #a855f7; font-weight: bold; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .a-dot { width: 8px; height: 8px; border-radius: 50%; background: #27ae60; }
    .a-dot.paused { background: #e94560; }
    .a-info { font-size: 12px; color: #888; line-height: 1.8; }
    .a-dishes { font-size: 12px; color: #ccc; margin-bottom: 4px; }

    /* 前台广告 */
    .display-screen {
      background: #0a0a14;
      border: 2px solid #222;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }
    .display-brand { font-size: 12px; color: #555; letter-spacing: 4px; margin-bottom: 10px; }
    .display-menu {
      background: #12121e;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
      text-align: left;
      font-size: 12px;
    }
    .display-menu-title { color: #555; margin-bottom: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .display-dishes { color: #aaa; line-height: 1.8; }
    .display-price { font-size: 44px; font-weight: bold; color: #fff; margin: 8px 0; }
    .display-price.disc { color: #f39c12; }
    .display-price.free { color: #27ae60; }
    .display-save { font-size: 12px; color: #666; margin-bottom: 10px; }
    .display-countdown {
      background: #12121e;
      border: 2px solid #e94560;
      border-radius: 8px;
      padding: 12px;
      margin: 8px 0;
    }
    .display-countdown-label { font-size: 11px; color: #666; margin-bottom: 4px; }
    .display-countdown-time { font-size: 32px; font-weight: bold; color: #e94560; font-variant-numeric: tabular-nums; }
    .display-countdown-range { font-size: 10px; color: #555; margin-top: 2px; }
    .display-next { font-size: 12px; color: #666; margin-top: 8px; }
    .display-next span { color: #f39c12; font-weight: bold; }
    .phase-label {
      background: #1a1a2e;
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 10px;
      display: inline-block;
      margin-bottom: 10px;
    }

    /* 叙述文字 */
    .narrative {
      grid-column: 1 / -1;
      background: #0f0f1a;
      border-left: 3px solid #e94560;
      padding: 12px 16px;
      font-size: 13px;
      color: #aaa;
      line-height: 1.7;
      border-radius: 0 6px 6px 0;
      min-height: 60px;
    }
    .narrative .t { color: #f39c12; font-weight: bold; }
    .narrative .ai { color: #e94560; font-weight: bold; }
    .narrative .green { color: #27ae60; font-weight: bold; }
    .narrative .money { color: #f39c12; font-weight: bold; }
  </style>
</head>
<body>

<div class="top-bar" id="topBar">
  <!-- 时间轴按钮由 JS 动态生成 -->
  <div class="top-right">
    <div class="speed-btns">
      <button onclick="setSpeed(1)" id="sp1" class="active">1x</button>
      <button onclick="setSpeed(5)" id="sp5">5x</button>
      <button onclick="setSpeed(20)" id="sp20">20x</button>
      <button onclick="setSpeed(60)" id="sp60">60x</button>
    </div>
    <div class="clock" id="clock">08:00</div>
    <button class="play-btn" id="playBtn" onclick="togglePlay()">▶ 开始</button>
  </div>
</div>

<div class="main">

  <!-- 左侧：采购系统 -->
  <div class="panel">
    <div class="panel-title">① 食材采购系统</div>
    <div class="budget-bar">
      <span class="budget-label">今日采购预算</span>
      <span class="budget-val" id="budget">¥2,000</span>
    </div>

    <div class="procure-list" id="procureList">
      <div style="font-size:12px;color:#555;padding:20px;text-align:center;">
        等待AI生成采购清单...
      </div>
    </div>

    <div class="ai-decision-box" id="aiBox" style="display:none;">
      <div class="ai-decision-title">🤖 AI 今日决策</div>
      <div class="ai-decision-text" id="aiText"></div>
    </div>
  </div>

  <!-- 中间：收银系统 -->
  <div class="panel">
    <div class="panel-title">② 收银系统（中控）</div>

    <div class="pos-display">
      <div class="pos-period" id="posPeriod">等待营业</div>
      <div class="pos-price" id="posPrice">¥0</div>
      <div class="pos-tier" id="posTier">—</div>
      <div class="pos-status-pill pill-closed" id="posStatus">准备中</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="statCustomers">0</div>
        <div class="stat-label">累计客流</div>
      </div>
      <div class="stat-card">
        <div class="stat-num green" id="statRevenue">¥0</div>
        <div class="stat-label">累计收入</div>
      </div>
      <div class="stat-card">
        <div class="stat-num yellow" id="statBatches">0</div>
        <div class="stat-label">A档已投放</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statLeft">—</div>
        <div class="stat-label">剩余预算</div>
      </div>
    </div>

    <!-- 配菜进度 -->
    <div class="panel-title" style="margin-top:6px;">配菜进度</div>
    <div class="prep-grid" id="prepGrid"></div>
  </div>

  <!-- 右侧：前台广告 -->
  <div class="panel">
    <div class="panel-title">④ 前台广告大屏</div>
    <div class="display-screen" id="displayScreen">
      <div class="display-brand">M E N Z 快 餐</div>
      <div class="phase-label" id="phaseLabel">准备中</div>

      <div class="display-menu" id="displayMenu">
        <div class="display-menu-title">今日菜品</div>
        <div class="display-dishes" id="displayDishes">等待系统启动...</div>
      </div>

      <div class="display-price" id="displayPrice">¥0</div>
      <div class="display-save" id="displaySave"></div>

      <div class="display-countdown" id="displayCountdown">
        <div class="display-countdown-label" id="countdownLabel">距离开业还有</div>
        <div class="display-countdown-time" id="countdownTime">02:30:00</div>
        <div class="display-countdown-range" id="countdownRange">11:00 午餐开业</div>
      </div>

      <div class="display-next" id="displayNext" style="display:none">
        下一档 <span id="nextPrice">¥16</span>
      </div>
    </div>
  </div>

  <!-- 下方：后厨电视 -->
  <div class="panel" style="grid-column:1/-1">
    <div class="panel-title">③ 后厨电视</div>

    <!-- 备菜指令区（营业前显示） -->
    <div class="kitchen-prep-panel" id="kitchenPrepPanel">
      <div class="kp-header">
        <span class="kp-dot" id="kpDot"></span>
        <span id="kpTitle">AI 备菜指令</span>
      </div>
      <div class="kp-instructions" id="kpInstructions">
        等待AI生成今日备菜计划...
      </div>
      <div class="kp-progress-area" id="kpProgressArea"></div>
    </div>

    <!-- A档控制（营业时显示） -->
    <div class="a-control" id="aControl" style="display:none">
      <div class="a-header">
        <div class="a-dot" id="aDot"></div>
        A档 出菜控制
        <span style="font-size:10px;color:#888;font-weight:normal;" id="aModeText"></span>
      </div>
      <div class="a-dishes" id="aDishesText">姜葱牛肉 / 清蒸鲈鱼</div>
      <div class="a-info" id="aInfo">已投放：0 批 | 剩余：8 批</div>
    </div>

    <div class="kitchen-grid" id="kitchenGrid"></div>
  </div>

  <!-- 叙述 -->
  <div class="narrative" id="narrative">
    <span class="t">08:00</span> 系统启动。<span class="ai">AI</span>正在分析今日食材市场价格，准备生成采购清单...
  </div>

</div>

<script>
// ===========================
//  全天运营模拟引擎
// ===========================

// -------- 菜品库 --------
const DISHES_A = ['姜葱牛肉', '清蒸鲈鱼'];
const DISHES_B = ['洋葱牛肉', '糖醋里脊', '咕噜肉', '啫啫滑鸡'];
const DISHES_C = ['番茄炒蛋', '苦瓜炒蛋', '蒜蓉菜心', '四季豆肉末'];
const ALL_DISHES = [...DISHES_A, ...DISHES_B, ...DISHES_C];

// 食材采购清单（示例价格）
const INGREDIENTS = {
  '牛肉': { unit: '斤', price: 35, perBatch: 1.5 },
  '五花肉': { unit: '斤', price: 18, perBatch: 2 },
  '鸡肉': { unit: '斤', price: 14, perBatch: 2 },
  '鲈鱼': { unit: '斤', price: 22, perBatch: 1 },
  '鸡蛋': { unit: '斤', price: 7, perBatch: 1 },
  '番茄': { unit: '斤', price: 4, perBatch: 1.5 },
  '菜心': { unit: '斤', price: 3, perBatch: 2 },
  '苦瓜': { unit: '斤', price: 5, perBatch: 1 },
  '四季豆': { unit: '斤', price: 6, perBatch: 1.5 },
  '洋葱': { unit: '斤', price: 3, perBatch: 0.5 },
  '蒜': { unit: '两', price: 1, perBatch: 2 },
  '葱姜': { unit: '斤', price: 5, perBatch: 0.5 },
  '菠萝': { unit: '个', price: 3, perBatch: 1 },
  '酸梅酱': { unit: '瓶', price: 8, perBatch: 0.2 },
  '沙爹酱': { unit: '瓶', price: 12, perBatch: 0.2 },
  '豆豉': { unit: '包', price: 5, perBatch: 0.3 },
};

// -------- 采购清单生成 --------
function generateProcureList() {
  const BUDGET = 2000;
  let spent = 0;
  const items = [];

  // 预估每道菜需要多少批次
  // A档: 8批（80人份，每批10人）
  // B档: 12批（120人份，每批10人）
  // C档: 6批（60人份，每批10人）

  const needs = {
    '牛肉': 1.5 * 12,      // 洋葱牛肉 + 姜葱牛肉
    '五花肉': 2 * 4,       // 糖醋里脊 + 咕噜肉
    '鸡肉': 2 * 4,         // 啫啫滑鸡
    '鲈鱼': 1 * 8,         // A档清蒸鲈鱼
    '鸡蛋': 1 * 6,         // 番茄炒蛋 + 苦瓜炒蛋
    '番茄': 1.5 * 6,       // 番茄炒蛋
    '苦瓜': 1 * 3,         // 苦瓜炒蛋
    '菜心': 2 * 3,         // 蒜蓉菜心
    '四季豆': 1.5 * 3,     // 四季豆肉末
    '猪肉末': 1 * 3,       // 四季豆肉末
    '洋葱': 0.5 * 6,       // 洋葱牛肉
    '蒜': 0.2 * 8,        // 多道共用
    '葱姜': 0.5 * 10,
    '菠萝': 1 * 2,         // 咕噜肉
    '酸梅酱': 0.2 * 2,
    '沙爹酱': 0.2 * 2,
    '豆豉': 0.3 * 2,
    '蚝油': 0.2 * 4,
    '沙姜': 0.1 * 4,
  };

  // 计算总价
  let total = 0;
  for (const [name, ing] of Object.entries(INGREDIENTS)) {
    const qty = needs[name] || 0;
    if (qty > 0) {
      total += qty * ing.price;
    }
  }

  // 按比例分配到 ¥2000
  const scale = Math.min(1, BUDGET / total);

  for (const [name, ing] of Object.entries(INGREDIENTS)) {
    const qty = Math.round((needs[name] || 0) * scale * 10) / 10;
    if (qty > 0) {
      const cost = Math.round(qty * ing.price);
      items.push({ name, qty, unit: ing.unit, price: ing.price, cost });
      spent += cost;
    }
  }

  return { items, spent, total, budget: BUDGET, surplus: BUDGET - spent };
}

// -------- 模拟循环 --------
let intervalId = null;

function tick() {
  if (!S.running) return;

  S.tick++;
  S.totalMin++;

  const p = getPeriod(S.totalMin);
  const vel = getVelocity(S.totalMin);

  // 8:00 - 生成采购清单
  if (S.totalMin === 480 && !S.procureList) {
    S.procureList = generateProcureList();
    renderProcureList();
    document.getElementById('aiBox').style.display = 'block';
    document.getElementById('aiText').innerHTML = `
      今日菜单已确定：<br>
      A档：${TODAY.a.join('、')}<br>
      B档：${TODAY.b.join('、')}<br>
      C档：${TODAY.c.join('、')}<br>
      配菜框：共${S.prepBaskets ? S.prepBaskets.length : '?'}框（每框10人份）<br>
      采购预算：<span class="money">¥${S.procureList.spent}</span> / ¥2,000
    `;
  }

  // 8:00-10:00 采购阶段（配菜进度）
  if (S.totalMin >= 480 && S.totalMin < 630) {
    // 生成配菜框（仅一次）
    if (!S.procureBasketsDone) {
      S.procureBasketsDone = true;
      S.prepBaskets = generatePrepBaskets();
    }
    // 实时刷新配菜进度
    renderBaskets();

    if (S.totalMin >= 620) {
      S.procureDone = true;
    }
  }

  // 10:30 - 开始预热烹饪
  if (S.totalMin === 630) {
    renderKitchenF3();
    document.getElementById('kitchenPrepPanel').style.display = 'none';
    document.getElementById('aControl').style.display = 'block';
    S.f3[0] = { dish: '预热中', next: '等待11:00出菜', status: 'cooking' };
    S.f3[1] = { dish: '预热中', next: '等待11:00出菜', status: 'cooking' };
    S.f3[2] = { dish: '预热中', next: '等待11:00出菜', status: 'cooking' };
  }

  // 11:00 - 午餐开业（B/C档先上，不上A档）
  if (S.totalMin === 660) {
    S.f3[0] = { dish: TODAY.b[0], next: '下一道：' + TODAY.b[1], status: 'cooking' };
    S.f3[1] = { dish: TODAY.b[1], next: '下一道：' + TODAY.b[2], status: 'cooking' };
    S.f3[2] = { dish: TODAY.c[0], next: '下一道：' + TODAY.c[1], status: 'cooking' };
  }

  // 17:00 - 晚餐开业（B/C档先上，不上A档）
  if (S.totalMin === 1020) {
    S.customers = 0;
    S.revenue = 0;
    S.aBatches = 0;
    S.aiEvents = { peakDetected: false, aReleased: false, slowdown: false, aPause: false, closed: false };
    S.f3[0] = { dish: TODAY.b[0], next: '下一道：' + TODAY.b[1], status: 'cooking' };
    S.f3[1] = { dish: TODAY.b[1], next: '下一道：' + TODAY.b[2], status: 'cooking' };
    S.f3[2] = { dish: TODAY.c[0], next: '下一道：' + TODAY.c[1], status: 'cooking' };
  }

  // 11:30+ 正价时段，每5分钟处理客流
  if (S.totalMin >= 660 && S.totalMin < 900) {
    if (S.tick % 5 === 0) {
      const count = vel;
      for (let i = 0; i < count; i++) {
        if (Math.random() < 0.88) {
          S.customers++;
          let rev = p.bPrice;
          if (p.tag === 'normal' && Math.random() < 0.28) rev += 5;
          S.revenue += rev;
          // AI 投放A档
          if (p.tag === 'normal' && !S.aPaused && vel >= 6 && S.aBatches < 8) {
            if (Math.random() < 0.45) {
              S.aBatches++;
              const f3i = (S.aBatches - 1) % 3;
              const dishName = TODAY.a[(S.aBatches - 1) % 2];
              S.f3[f3i] = { dish: dishName, next: '烹饪中...', status: 'cooking' };
            }
          }
        }
      }
    }
    // F3 完成循环
    if (S.tick % 6 === 0) {
      for (let i = 0; i < 3; i++) {
        if (S.f3[i].status === 'cooking') {
          S.f3[i].status = 'ready';
          S.f3[i].next = '→ 已投放保温台';
        } else if (S.f3[i].status === 'ready') {
          const nextDish = TODAY.b[(Math.floor(S.tick/6) + i) % TODAY.b.length];
          S.f3[i] = { dish: nextDish, next: '下一道...', status: 'idle' };
        }
      }
    }
  }

  // 晚餐
  if (S.totalMin >= 1020 && S.totalMin < 1260) {
    if (S.tick % 5 === 0) {
      const count = vel;
      for (let i = 0; i < count; i++) {
        if (Math.random() < 0.88) {
          S.customers++;
          let rev = p.bPrice;
          if (p.tag === 'normal' && Math.random() < 0.28) rev += 5;
          S.revenue += rev;
          if (p.tag === 'normal' && !S.aPaused && vel >= 6 && S.aBatches < 8) {
            if (Math.random() < 0.45) {
              S.aBatches++;
              const f3i = (S.aBatches - 1) % 3;
              const dishName = TODAY.a[(S.aBatches - 1) % 2];
              S.f3[f3i] = { dish: dishName, next: '烹饪中...', status: 'cooking' };
            }
          }
        }
      }
    }
    if (S.tick % 6 === 0) {
      for (let i = 0; i < 3; i++) {
        if (S.f3[i].status === 'cooking') {
          S.f3[i].status = 'ready';
          S.f3[i].next = '→ 已投放保温台';
        } else if (S.f3[i].status === 'ready') {
          const nextDish = TODAY.b[(Math.floor(S.tick/6) + i) % TODAY.b.length];
          S.f3[i] = { dish: nextDish, next: '下一道...', status: 'idle' };
        }
      }
    }
  }

  // A档暂停（客流不足时）
  if (S.totalMin >= 780 && S.totalMin < 1140) {
    if (vel < 5) S.aPaused = true;
    else if (vel >= 6) S.aPaused = false;
  }

  updateUI();
  updateNarrative();

  // 结束
  if (S.totalMin >= 1440) { // 24:00
    S.running = false;
    document.getElementById('playBtn').textContent = '▶ 重播';
    document.getElementById('playBtn').onclick = resetSim;
  }
}

  total.style.borderTop = '2px solid #333';
  total.style.marginTop = '6px';
  total.style.paddingTop = '8px';
  total.innerHTML = `<span style="color:#888;font-size:11px;">合计</span><span></span><span class="qty" style="color:#f39c12;font-size:14px;">¥${S.procureList.spent}</span>`;
  list.appendChild(total);
}

function togglePlay() {
  if (S.running) {
    S.running = false;
    document.getElementById('playBtn').textContent = '▶ 继续';
    clearInterval(intervalId);
  } else {
    S.running = true;
    document.getElementById('playBtn').textContent = '⏸ 暂停';
    intervalId = setInterval(tick, 1000 / S.speed);
  }
}

function resetSim() {
  clearInterval(intervalId);
  S = {
    running: false, speed: S.speed, tick: 0, totalMin: 480,
    customers: 0, revenue: 0, aBatches: 0, aPaused: false,
    procureDone: false, prepDone: false,
    phaseEvents: { procureDone: false, prepDone: false, cookStart: false, lunchEnd: false, dinnerEnd: false },
    f3: [
      { dish: '—', next: '空闲中', status: 'idle' },
      { dish: '—', next: '空闲中', status: 'idle' },
      { dish: '—', next: '空闲中', status: 'idle' },
    ],
    prepProgress: {}, procureList: S.procureList, prepBaskets: null, procureBasketsDone: false, // 保留采购清单
    procurementArrived: false, lastPhase: null,
    aiEvents: { peakDetected: false, aReleased: false, slowdown: false, aPause: false, closed: false },
  };
  document.getElementById('playBtn').textContent = '▶ 开始';
  document.getElementById('playBtn').onclick = togglePlay;
  document.getElementById('procureList').innerHTML = '<div style="font-size:12px;color:#555;padding:20px;text-align:center;">等待AI生成采购清单...</div>';
  document.getElementById('prepGrid').innerHTML = '';
  document.getElementById('aiBox').style.display = 'none';
  updateUI();
  updateNarrative();
}

function setSpeed(s) {
  S.speed = s;
  document.querySelectorAll('.speed-btns button').forEach(b => b.classList.remove('active'));
  document.getElementById('sp' + s).classList.add('active');
  if (S.running) {
    clearInterval(intervalId);
    intervalId = setInterval(tick, 1000 / s);
  }
}

// -------- 时间轴按钮 --------
function buildTimeline() {
  const bar = document.getElementById('topBar');
  const phases = [
    { h: 8,  label: '08:00', cls: 'phase-procure', note: '采购' },
    { h: 10, label: '10:00', cls: 'phase-prep', note: '备菜' },
    { h: 10, label: '10:30', cls: 'phase-cook', note: '预热' },
    { h: 11, label: '11:00', cls: 'phase-open', note: '开业' },
    { h: 12, label: '12:00', cls: 'phase-open', note: '' },
    { h: 13, label: '13:00', cls: 'phase-open', note: '' },
    { h: 15, label: '15:00', cls: 'phase-close', note: '午休' },
    { h: 17, label: '17:00', cls: 'phase-open', note: '晚餐' },
    { h: 18, label: '18:00', cls: 'phase-open', note: '' },
    { h: 19, label: '19:00', cls: 'phase-open', note: '' },
    { h: 21, label: '21:00', cls: 'phase-close', note: '赠送' },
  ];
  phases.forEach(p => {
    const btn = document.createElement('div');
    btn.className = 'hour-btn ' + p.cls;
    btn.dataset.h = p.h;
    btn.textContent = p.label + (p.note ? ' ' + p.note : '');
    btn.onclick = () => jumpToHour(p.h);
    bar.insertBefore(btn, bar.querySelector('.top-right'));
  });
}

function jumpToHour(h) {
  S.totalMin = h * 60;
  S.tick = S.totalMin - 480;
  S.running = false;
  clearInterval(intervalId);
  document.getElementById('playBtn').textContent = '▶ 继续';
  updateUI();
  updateNarrative();
}

// -------- 初始化 --------
buildTimeline();
updateUI();
updateNarrative();
</script>
</body>
</html>
