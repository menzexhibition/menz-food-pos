<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MENZ 快餐收银系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      background: #1a1a2e;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* 顶部状态栏 */
    .top-bar {
      background: #16213e;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #0f3460;
      font-size: 14px;
    }
    .top-bar .time { font-size: 20px; font-weight: bold; color: #e94560; }
    .top-bar .period {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
    }
    .period-normal { background: #e94560; color: #fff; }
    .period-discount { background: #0f3460; color: #f39c12; border: 1px solid #f39c12; }
    .period-free { background: #27ae60; color: #fff; }

    /* 主布局 */
    .main {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      height: calc(100vh - 60px);
      gap: 2px;
      background: #0f3460;
      padding: 2px;
    }

    /* 左侧：选择区 */
    .panel {
      background: #16213e;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .panel-title {
      font-size: 14px;
      color: #888;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* 档位选择 */
    .tier-btn {
      flex: 1;
      margin: 6px 0;
      border: 3px solid #0f3460;
      border-radius: 12px;
      background: #1a1a2e;
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tier-btn .sub { font-size: 13px; color: #888; font-weight: normal; }
    .tier-btn.active { border-color: #e94560; background: #e94560; }
    .tier-btn .price-tag {
      font-size: 16px;
      color: #f39c12;
    }
    .tier-btn.active .price-tag { color: #ffe; }

    /* 数量选择 */
    .qty-section { margin-top: 12px; }
    .qty-section .panel-title { font-size: 12px; }
    .qty-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .qty-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid #0f3460;
      background: #1a1a2e;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
    }
    .qty-btn:active { background: #0f3460; }
    .qty-num {
      font-size: 40px;
      font-weight: bold;
      min-width: 60px;
      text-align: center;
    }

    /* 中间：价格明细 */
    .summary-box {
      background: #0f3460;
      border-radius: 12px;
      padding: 16px;
      margin: 6px 0;
      flex: 1;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #1a1a2e;
      font-size: 16px;
    }
    .summary-row:last-child { border-bottom: none; }
    .summary-row.total {
      border-top: 2px solid #e94560;
      margin-top: 8px;
      padding-top: 14px;
      font-size: 22px;
      font-weight: bold;
      color: #e94560;
    }
    .summary-row .label { color: #888; }
    .summary-row .val { color: #fff; }

    .info-box {
      background: #0f3460;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #888;
      margin-top: 8px;
      line-height: 1.6;
    }
    .info-box .highlight { color: #f39c12; font-weight: bold; }

    /* 右侧：支付操作 */
    .pay-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pay-btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .pay-btn .sub { font-size: 12px; font-weight: normal; opacity: 0.8; }
    .pay-btn:active { opacity: 0.85; transform: scale(0.98); }
    .pay-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-wechat { background: #07c160; color: #fff; }
    .btn-alipay { background: #1677ff; color: #fff; }
    .btn-cash { background: #0f3460; color: #fff; border: 2px solid #e94560; }
    .btn-test { background: #f39c12; color: #1a1a2e; }

    /* 状态覆盖层 */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .overlay.show { display: flex; }
    .overlay-icon { font-size: 72px; }
    .overlay-text { font-size: 28px; font-weight: bold; }
    .overlay-sub { font-size: 16px; color: #888; }
    .overlay-dismiss {
      margin-top: 20px;
      padding: 12px 40px;
      border: 2px solid #e94560;
      background: transparent;
      color: #e94560;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    /* 核销按钮 */
    .void-btn {
      margin-top: 8px;
      padding: 10px;
      border: 2px solid #c0392b;
      background: transparent;
      color: #c0392b;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
    }
    .void-btn:active { background: #c0392b; color: #fff; }

    /* 历史记录 */
    .log-section {
      background: #0f3460;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      flex: 1;
      overflow-y: auto;
      max-height: 200px;
    }
    .log-entry {
      font-size: 12px;
      padding: 4px 0;
      border-bottom: 1px solid #1a1a2e;
      color: #aaa;
    }
    .log-entry .ok { color: #27ae60; }
    .log-entry .fail { color: #e94560; }

    /* 打印小票预览 */
    .receipt-preview {
      display: none;
      background: #fff;
      color: #000;
      padding: 16px;
      border-radius: 8px;
      font-size: 12px;
      width: 200px;
      margin-top: 10px;
    }
    .receipt-preview.show { display: block; }
    .receipt-title { text-align: center; font-weight: bold; font-size: 14px; border-bottom: 1px dashed #000; padding-bottom: 8px; margin-bottom: 8px; }
    .receipt-row { display: flex; justify-content: space-between; padding: 2px 0; }
    .receipt-total { border-top: 1px dashed #000; margin-top: 6px; padding-top: 6px; font-weight: bold; }
  </style>
</head>
<body>

<!-- 顶部状态栏 -->
<div class="top-bar">
  <div>
    <span>MENZ 快餐</span>
    <span class="time" id="clock">--:--:--</span>
  </div>
  <div>
    <span class="period" id="periodTag">午餐正价</span>
  </div>
  <div style="font-size:12px;color:#666;" id="dateTag"></div>
</div>

<!-- 主界面 -->
<div class="main">

  <!-- 第一列：档位选择 -->
  <div class="panel">
    <div class="panel-title">选择套餐</div>

    <button class="tier-btn active" id="btnB" onclick="selectTier('B')">
      <span>B 档</span>
      <span class="sub">主菜自选 + 汤饭免费</span>
      <span class="price-tag" id="priceB">¥18</span>
    </button>

    <button class="tier-btn" id="btnBA" onclick="selectTier('BA')">
      <span>B + A 档</span>
      <span class="sub">主菜 + 招牌菜（正价时段）</span>
      <span class="price-tag" id="priceBA">¥23</span>
    </button>

    <div class="qty-section">
      <div class="panel-title">数量</div>
      <div class="qty-row">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <span class="qty-num" id="qtyNum">1</span>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
    </div>

    <button class="void-btn" onclick="voidLast()">撤销上一笔</button>
  </div>

  <!-- 第二列：价格明细 -->
  <div class="panel">
    <div class="panel-title">费用明细</div>

    <div class="summary-box">
      <div class="summary-row">
        <span class="label">套餐</span>
        <span class="val" id="summaryTier">B 档</span>
      </div>
      <div class="summary-row">
        <span class="label">时段</span>
        <span class="val" id="summaryPeriod">午餐正价</span>
      </div>
      <div class="summary-row">
        <span class="label">单价</span>
        <span class="val" id="summaryUnit">¥18</span>
      </div>
      <div class="summary-row">
        <span class="label">数量</span>
        <span class="val" id="summaryQty">1 份</span>
      </div>
      <div class="summary-row total">
        <span>合计</span>
        <span id="summaryTotal">¥18</span>
      </div>
    </div>

    <div class="info-box" id="infoBox">
      正价时段：A档加¥5可购<br>
      非正价时段：A档按折扣价供应<br>
      赠送时段：A档随缘赠送
    </div>

    <div class="log-section" id="logSection">
      <div class="panel-title">交易记录</div>
      <div id="logList"></div>
    </div>
  </div>

  <!-- 第三列：支付 -->
  <div class="panel pay-section">
    <div class="panel-title">收款方式</div>

    <button class="pay-btn btn-wechat" onclick="pay('wechat')">
      <span>微信支付</span>
      <span class="sub" id="wechatAmount">¥18</span>
    </button>

    <button class="pay-btn btn-alipay" onclick="pay('alipay')">
      <span>支付宝</span>
      <span class="sub" id="alipayAmount">¥18</span>
    </button>

    <button class="pay-btn btn-cash" onclick="pay('cash')">
      <span>现金 / 其他</span>
      <span class="sub" id="cashAmount">¥18</span>
    </button>

    <button class="pay-btn btn-test" onclick="pay('test')">
      <span>测试模式</span>
      <span class="sub">模拟支付成功</span>
    </button>

    <div class="receipt-preview" id="receipt">
      <div class="receipt-title">MENZ 快餐<br>销售小票</div>
      <div class="receipt-row"><span id="rTime"></span><span id="rDate"></span></div>
      <div style="border-bottom:1px dashed #000;margin:6px 0;"></div>
      <div class="receipt-row"><span id="rTier"></span><span id="rTotal"></span></div>
      <div class="receipt-row"><span>数量</span><span id="rQty"></span></div>
      <div class="receipt-row"><span>支付方式</span><span id="rPay"></span></div>
      <div class="receipt-row"><span>找零</span><span id="rChange">—</span></div>
      <div style="border-bottom:1px dashed #000;margin:6px 0;"></div>
      <div class="receipt-row receipt-total"><span>实收</span><span id="rPaid"></span></div>
      <div style="text-align:center;margin-top:8px;font-size:10px;color:#888;">谢谢光临 MENZ</div>
    </div>
  </div>

</div>

<!-- 支付状态覆盖层 -->
<div class="overlay" id="overlay">
  <div class="overlay-icon" id="overlayIcon">⏳</div>
  <div class="overlay-text" id="overlayText">等待支付...</div>
  <div class="overlay-sub" id="overlaySub">请顾客扫码 / 付款</div>
  <button class="overlay-dismiss" id="overlayDismiss" onclick="dismissOverlay()" style="display:none">确认收款</button>
</div>

<script>
// ===== 状态 =====
let state = {
  tier: 'B',      // 'B' or 'BA'
  qty: 1,
  lastTransaction: null,
};

// ===== 时段配置 =====
function getPeriod() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  const totalMin = h * 60 + m;

  // ===== 午餐 11:00 - 15:00 =====
  if (totalMin >= 11 * 60 && totalMin < 15 * 60) {
    if (totalMin < 11 * 60 + 30)   return { name: '午餐优惠', bPrice: 15, aAvailable: false, aExtra: 0, tag: 'discount' };
    if (totalMin < 13 * 60)        return { name: '午餐正价', bPrice: 18, aAvailable: true,  aExtra: 5, tag: 'normal'  };
    if (totalMin < 13 * 60 + 30)   return { name: '午餐折扣', bPrice: 16, aAvailable: false, aExtra: 0, tag: 'discount' };
    if (totalMin < 13 * 60 + 60)   return { name: '午餐折扣', bPrice: 14, aAvailable: false, aExtra: 0, tag: 'discount' };
    if (totalMin < 14 * 60 + 30)   return { name: '午餐折扣', bPrice: 12, aAvailable: false, aExtra: 0, tag: 'discount' };
                                        return { name: '午餐折扣', bPrice: 10, aAvailable: false, aExtra: 0, tag: 'discount' };
  }

  // ===== 晚餐 17:00 - 21:00 =====
  if (totalMin >= 17 * 60 && totalMin < 21 * 60) {
    if (totalMin < 17 * 60 + 30)   return { name: '晚餐优惠', bPrice: 15, aAvailable: false, aExtra: 0, tag: 'discount' };
    if (totalMin < 19 * 60)        return { name: '晚餐正价', bPrice: 18, aAvailable: true,  aExtra: 5, tag: 'normal'  };
    if (totalMin < 19 * 60 + 30)   return { name: '晚餐折扣', bPrice: 16, aAvailable: false, aExtra: 0, tag: 'discount' };
    if (totalMin < 19 * 60 + 60)   return { name: '晚餐折扣', bPrice: 14, aAvailable: false, aExtra: 0, tag: 'discount' };
    if (totalMin < 20 * 60 + 30)   return { name: '晚餐折扣', bPrice: 12, aAvailable: false, aExtra: 0, tag: 'discount' };
                                        return { name: '晚餐折扣', bPrice: 10, aAvailable: false, aExtra: 0, tag: 'discount' };
  }

  // ===== 非营业或赠送 =====
  if (totalMin >= 15 * 60 && totalMin < 17 * 60) {
    return { name: '午休停业', bPrice: 0, aAvailable: false, aExtra: 0, tag: 'closed' };
  }
  if (totalMin >= 21 * 60 || totalMin < 11 * 60) {
    return { name: '赠送时段', bPrice: 0, aAvailable: false, aExtra: 0, tag: 'free' };
  }

  return { name: '非营业', bPrice: 18, aAvailable: false, aExtra: 0, tag: 'closed' };
}

function calcPrice() {
  const p = getPeriod();
  if (p.tag === 'free') return 0;
  if (p.tag === 'closed') return p.bPrice;
  if (state.tier === 'B') return p.bPrice;
  // BA: B + A
  if (p.aAvailable) return p.bPrice + p.aExtra; // 正价 A档 +5
  // 非正价时段，A档按B档折扣价算
  return p.bPrice;
}

function getTierLabel() {
  const p = getPeriod();
  if (state.tier === 'B') return 'B 档';
  if (p.aAvailable) return 'B + A 档（正价+¥5）';
  return 'B + A 档（折扣价）';
}

// ===== UI 更新 =====
function update() {
  const p = getPeriod();
  const total = calcPrice() * state.qty;

  // 时段标签
  document.getElementById('periodTag').textContent = p.name;
  document.getElementById('periodTag').className = 'period period-' + p.tag;

  // 价格标签
  document.getElementById('priceB').textContent = p.tag === 'free' ? '赠送' : '¥' + p.bPrice;

  let aPrice;
  if (p.tag === 'free') aPrice = 0;
  else if (p.tag === 'closed') aPrice = p.bPrice;
  else if (p.aAvailable) aPrice = p.bPrice + p.aExtra;
  else aPrice = p.bPrice;
  document.getElementById('priceBA').textContent = p.tag === 'free' ? '赠送' : '¥' + aPrice;

  // 按钮状态
  document.getElementById('btnB').classList.toggle('active', state.tier === 'B');
  document.getElementById('btnBA').classList.toggle('active', state.tier === 'BA');

  // A档按钮：非正价时段显示说明
  const btnBA = document.getElementById('btnBA');
  const baSub = btnBA.querySelector('.sub');
  if (p.tag === 'free') {
    baSub.textContent = '赠送时段·随缘供应';
  } else if (p.tag === 'closed') {
    baSub.textContent = '非营业时段';
  } else if (!p.aAvailable && state.tier === 'BA') {
    baSub.textContent = '当前按折扣价供应（若有A档剩余）';
  } else if (!p.aAvailable) {
    baSub.textContent = '当前时段无A档（若有余货按折扣价）';
  } else {
    baSub.textContent = '主菜 + 招牌菜（正价时段）';
  }

  // 明细
  document.getElementById('summaryTier').textContent = getTierLabel();
  document.getElementById('summaryPeriod').textContent = p.name;
  document.getElementById('summaryUnit').textContent = p.tag === 'free' ? '赠送' : '¥' + calcPrice();
  document.getElementById('summaryQty').textContent = state.qty + ' 份';
  document.getElementById('summaryTotal').textContent = p.tag === 'free' ? '¥0（赠送）' : '¥' + total;

  // 支付按钮金额
  const amounts = ['wechatAmount', 'alipayAmount', 'cashAmount'];
  amounts.forEach(id => {
    const el = document.getElementById(id);
    el.textContent = p.tag === 'free' ? '¥0' : '¥' + total;
  });

  // 信息框
  const info = document.getElementById('infoBox');
  if (p.tag === 'free') {
    info.innerHTML = '现在是<span class="highlight">赠送时段</span>，B档免费供应<br>A档若有剩余也随缘赠送';
  } else if (p.tag === 'closed') {
    info.innerHTML = '<span class="highlight">非营业时间</span>，暂不收款';
  } else if (p.aAvailable) {
    info.innerHTML = '<span class="highlight">正价时段</span>，A档加¥5可购';
  } else {
    info.innerHTML = '<span class="highlight">折扣时段</span>，A档按¥' + p.bPrice + '供应（若有余货）';
  }
}

// ===== 操作 =====
function selectTier(t) {
  state.tier = t;
  update();
}

function changeQty(delta) {
  const p = getPeriod();
  if (p.tag === 'free') {
    // 赠送时段只能点1份
    if (state.qty === 1 && delta > 0) return;
    state.qty = Math.max(1, state.qty + delta);
  } else {
    state.qty = Math.max(1, Math.min(20, state.qty + delta));
  }
  document.getElementById('qtyNum').textContent = state.qty;
  update();
}

function pay(method) {
  const p = getPeriod();
  if (p.tag === 'closed') { alert('非营业时间'); return; }

  const total = calcPrice() * state.qty;

  // 记录交易
  const transaction = {
    time: new Date().toLocaleTimeString('zh-CN'),
    period: p.name,
    tier: state.tier,
    unitPrice: calcPrice(),
    qty: state.qty,
    total: total,
    method: method,
    date: new Date().toLocaleDateString('zh-CN'),
  };

  // 模拟支付流程
  showOverlay('wait');

  // 测试模式/现金：立即成功
  if (method === 'test' || method === 'cash') {
    setTimeout(() => {
      transaction.success = true;
      completeTransaction(transaction);
    }, 500);
    return;
  }

  // 微信/支付宝：模拟等待
  // 真实场景：这里调用微信/支付宝 API，获取支付二维码
  // 收到回调后调用 completeTransaction(transaction)
  // 现在用测试模式模拟
  setTimeout(() => {
    // 模拟成功率95%
    if (Math.random() > 0.05) {
      transaction.success = true;
      completeTransaction(transaction);
    } else {
      showOverlay('fail');
    }
  }, 2000);
}

function completeTransaction(t) {
  state.lastTransaction = t;
  showOverlay('ok');
  updateReceipt(t);
  addLog(t);
  // 重置数量
  state.qty = 1;
  document.getElementById('qtyNum').textContent = 1;
  update();
}

function voidLast() {
  if (!state.lastTransaction) { alert('没有可撤销的交易'); return; }
  const t = state.lastTransaction;
  addLog({ ...t, voided: true });
  state.lastTransaction = null;
  alert('已撤销：' + t.tier + ' x' + t.qty + ' = ¥' + t.total);
  update();
}

// ===== 覆盖层 =====
function showOverlay(status) {
  const el = document.getElementById('overlay');
  const icon = document.getElementById('overlayIcon');
  const text = document.getElementById('overlayText');
  const sub = document.getElementById('overlaySub');
  const dismiss = document.getElementById('overlayDismiss');

  if (status === 'wait') {
    icon.textContent = '⏳';
    text.textContent = '等待支付...';
    sub.textContent = '请顾客扫码 / 付款';
    dismiss.style.display = 'none';
  } else if (status === 'ok') {
    icon.textContent = '✅';
    text.textContent = '收款成功';
    const t = state.lastTransaction;
    sub.textContent = '¥' + t.total + ' · ' + (t.method === 'wechat' ? '微信' : t.method === 'alipay' ? '支付宝' : t.method === 'cash' ? '现金' : '测试');
    dismiss.style.display = 'block';
    dismiss.textContent = '确认完成';
  } else if (status === 'fail') {
    icon.textContent = '❌';
    text.textContent = '支付失败';
    sub.textContent = '请重试或改用其他方式';
    dismiss.style.display = 'block';
    dismiss.textContent = '关闭';
  }
  el.classList.add('show');
}

function dismissOverlay() {
  document.getElementById('overlay').classList.remove('show');
}

// ===== 小票 =====
function updateReceipt(t) {
  document.getElementById('rTime').textContent = t.time;
  document.getElementById('rDate').textContent = t.date;
  document.getElementById('rTier').textContent = getTierLabel();
  document.getElementById('rTotal').textContent = '¥' + t.total;
  document.getElementById('rQty').textContent = t.qty;
  document.getElementById('rPay').textContent = t.method === 'wechat' ? '微信' : t.method === 'alipay' ? '支付宝' : t.method === 'cash' ? '现金' : '测试';
  document.getElementById('rPaid').textContent = '¥' + t.total;
  const receipt = document.getElementById('receipt');
  receipt.classList.add('show');
  setTimeout(() => receipt.classList.remove('show'), 4000);
}

// ===== 交易日志 =====
function addLog(t) {
  const list = document.getElementById('logList');
  const div = document.createElement('div');
  div.className = 'log-entry';
  const methodMap = { wechat: '微信', alipay: '支付宝', cash: '现金', test: '测试' };
  if (t.voided) {
    div.innerHTML = '<span class="fail">✕ 已撤销</span> ' + t.time + ' ' + t.tier + ' x' + t.qty;
  } else {
    div.innerHTML = '<span class="ok">✓</span> ' + t.time + ' ' + t.tier + ' x' + t.qty + ' = ¥' + t.total + ' (' + methodMap[t.method] + ')';
    // 发送到后台（控制台日志，真实环境替换为 fetch API）
    console.log('TRANSACTION:', JSON.stringify(t));
  }
  list.prepend(div);

  // 发送到 AI 后台（测试模式）
  fetch('/api/transaction', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(t)
  }).catch(() => {}); // 忽略错误，测试模式不要求后端存在
}

// ===== 时钟 =====
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('zh-CN', { hour12: false });
  document.getElementById('dateTag').textContent =
    now.toLocaleDateString('zh-CN', { weekday: 'short', month: 'short', day: 'numeric' });
  update();
}

// ===== 初始化 =====
tick();
setInterval(tick, 1000);
</script>
